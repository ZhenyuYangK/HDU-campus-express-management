name: hdu-campus-express

services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请先复制.env.example为.env}
      MYSQL_USER: ${MYSQL_USER:?请设置MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  backend-dev:
    build:
      context: ./infra/docker/backend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/backend
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      SERVER_PORT: '8080'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?请设置MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?请设置MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请设置MYSQL_PASSWORD}
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8080}:8080
    volumes:
      - ./backend:/workspace/backend
      - maven-cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'java -version && mvn --version']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend-dev:
    build:
      context: ./infra/docker/frontend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/frontend
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:5173
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
      - npm-cache:/root/.npm
    healthcheck:
      test: [CMD-SHELL, 'node --version && npm --version']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  api-docs:
    image: swaggerapi/swagger-ui:v5.34.0@sha256:58c1fbf5f5cf6d2ae857e4d1296cb02192fa5de472c1cd76f58b2be99523e1d0
    environment:
      SWAGGER_JSON: /contracts/openapi.yaml
      VALIDATOR_URL: ''
      SUPPORTED_SUBMIT_METHODS: '[]'
    ports:
      - 127.0.0.1:${API_DOCS_PORT:-8081}:8080
    volumes:
      - ./docs/api:/contracts:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql-data:
  maven-cache:
  frontend-node-modules:
  npm-cache:
